<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Boutique</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080b16;
  --panel: rgba(18, 24, 46, .92);
  --cyan: #55e6ff;
  --purple: #9d70ff;
  --green: #50e3a4;
  --red: #ff647c;
  --gold: #ffc968;
}
body {
  min-height: 100vh;
  font-family: Inter, system-ui, sans-serif;
  color: #f7f8ff;
  background:
    radial-gradient(circle at 15% 10%, rgba(85,230,255,.12), transparent 25%),
    radial-gradient(circle at 85% 20%, rgba(157,112,255,.12), transparent 25%),
    var(--bg);
}
header {
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  background: rgba(8,11,22,.82);
  backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  box-shadow: 0 0 28px rgba(85,230,255,.28);
  font-size: 22px;
}
.brand h1 { font-size: 18px; }
.brand small { color: #9ba6c7; }
.stats { display: flex; gap: 12px; }
.stat {
  min-width: 130px;
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  background: var(--panel);
}
.stat label { display: block; color: #929dbc; font-size: 11px; }
.stat strong { color: var(--cyan); font-size: 17px; }

main {
  max-width: 1400px;
  margin: auto;
  display: grid;
  grid-template-columns: 220px 1fr 290px;
  gap: 18px;
  padding: 18px;
}
aside, section {
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  background: var(--panel);
}
aside { height: fit-content; padding: 12px; }
nav button {
  width: 100%; height: 48px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 6px; padding: 0 14px;
  border: 0; border-radius: 12px;
  background: transparent; color: #99a4c4;
  font: inherit; cursor: pointer; text-align: left;
}
nav button.active {
  color: white;
  background: linear-gradient(90deg, rgba(85,230,255,.16), rgba(157,112,255,.08));
  box-shadow: inset 3px 0 var(--cyan);
}
section { min-height: calc(100vh - 114px); padding: 20px; }
.section-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.section-head h2 { font-size: 21px; }
.day-box { color: var(--gold); background: rgba(255,201,104,.08); padding: 8px 12px; border-radius: 10px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}
.card {
  position: relative;
  overflow: hidden;
  min-height: 190px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px;
  background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
  transition: .2s;
}
.card:hover { transform: translateY(-4px); border-color: rgba(85,230,255,.28); }
.emoji {
  height: 76px;
  display: grid; place-items: center;
  font-size: 46px;
  border-radius: 12px;
  background: rgba(255,255,255,.04);
  margin-bottom: 10px;
}
.card h3 { font-size: 15px; margin-bottom: 5px; }
.tier { font-size: 10px; color: var(--cyan); text-transform: uppercase; }
.price-row { display: flex; justify-content: space-between; margin: 10px 0; }
.buy-price { color: #ff8aa0; }
.sell-price { color: var(--green); }
button.primary {
  width: 100%; height: 38px;
  border: 0; border-radius: 10px;
  color: #09101c; font-weight: 800;
  background: linear-gradient(135deg, var(--cyan), #78ffd1);
  cursor: pointer;
}
button.primary:disabled { filter: grayscale(1); opacity: .35; cursor: not-allowed; }

.stock { font-size: 12px; color: #abb5d3; margin: 7px 0; }
.right { padding: 14px; }
.right h3 { margin-bottom: 12px; }
.log {
  height: 280px;
  overflow-y: auto;
  padding-right: 4px;
}
.log-item {
  padding: 9px 10px;
  margin-bottom: 7px;
  border-left: 3px solid var(--cyan);
  border-radius: 8px;
  background: rgba(255,255,255,.035);
  font-size: 12px;
  color: #bdc5dc;
}
.progress-wrap { margin: 12px 0; }
.progress {
  height: 8px;
  margin-top: 6px;
  border-radius: 20px;
  background: rgba(255,255,255,.07);
  overflow: hidden;
}
.progress div { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); }
.hidden { display: none; }

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  transform: translateY(100px);
  padding: 14px 18px;
  border: 1px solid rgba(85,230,255,.25);
  border-radius: 12px;
  background: #141a32;
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
  transition: .3s;
  z-index: 20;
}
.toast.show { transform: translateY(0); }

@media (max-width: 1000px) {
  main { grid-template-columns: 180px 1fr; }
  .right { display: none; }
}
@media (max-width: 700px) {
  header { height: auto; padding: 12px; flex-direction: column; gap: 10px; }
  main { grid-template-columns: 1fr; }
  aside nav { display: flex; overflow-x: auto; }
  nav button { min-width: 150px; }
  section { min-height: 500px; }
  .stats { width: 100%; }
  .stat { flex: 1; min-width: 0; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">◆</div>
    <div><h1>Empire Boutique</h1><small>Gestion commerciale</small></div>
  </div>
  <div class="stats">
    <div class="stat"><label>BUDGET</label><strong id="money">500 €</strong></div>
    <div class="stat"><label>BÉNÉFICES</label><strong id="profit">0 €</strong></div>
  </div>
</header>

<main>
  <aside>
    <nav>
      <button class="active" data-page="market">🛒 Marché</button>
      <button data-page="shop">🏪 Ma boutique</button>
      <button data-page="upgrades">⚡ Améliorations</button>
    </nav>
  </aside>

  <section>
    <div class="section-head">
      <h2 id="title">Marché fournisseur</h2>
      <div class="day-box" id="day">Jour 1</div>
    </div>
    <div id="market" class="grid"></div>
    <div id="shop" class="grid hidden"></div>
    <div id="upgrades" class="grid hidden"></div>
  </section>

  <aside class="right">
    <h3>Activité</h3>
    <div class="log" id="log"></div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
const products = [
  {name:"Crayon premium", emoji:"✏️", cost:4, sell:7, tier:"Starter"},
  {name:"Gourde", emoji:"🧴", cost:9, sell:15, tier:"Starter"},
  {name:"T-shirt minimal", emoji:"👕", cost:18, sell:29, tier:"Starter"},
  {name:"Casquette", emoji:"🧢", cost:25, sell:40, tier:"Équipement"},
  {name:"Enceinte", emoji:"🔊", cost:45, sell:72, tier:"Électronique"},
  {name:"Montre", emoji:"⌚", cost:85, sell:145, tier:"Électronique"},
  {name:"Drone", emoji:"🚁", cost:180, sell:310, tier:"Tech"},
  {name:"Ordinateur", emoji:"💻", cost:450, sell:720, tier:"Premium"},
  {name:"Console", emoji:"🎮", cost:550, sell:840, tier:"Premium"},
  {name:"Moto", emoji:"🏍️", cost:1800, sell:2400, tier:"Luxe"},
  {name:"Voiture", emoji:"🚗", cost:6000, sell:7600, tier:"Collection"},
  {name:"Yacht", emoji:"🛥️", cost:18000, sell:24000, tier:"Elite"}
];

let state = {
  money: 500,
  profit: 0,
  day: 1,
  reputation: 1,
  stock: {},
  upgrades: {pub:0, stock:0, qualification:0}
};

products.forEach(p => state.stock[p.name] = 0);

const upgrades = [
  {id:"pub", name:"Publicité", emoji:"📣", base:100, text:"+ ventes par jour"},
  {id:"stock", name:"Entrepôt", emoji:"📦", base:250, text:"Bonus de livraison"},
  {id:"qualification", name:"Étiquette qualité", emoji:"✨", base:500, text:"+ bénéfice des ventes"}
];

function euro(value) {
  return Math.round(value).toLocaleString("fr-FR") + " €";
}

function save() {
  localStorage.setItem("empireBoutique", JSON.stringify(state));
}

function load() {
  const saved = JSON.parse(localStorage.getItem("empireBoutique"));
  if(saved) state = {...state, ...saved};
}

function log(text) {
  const el = document.getElementById("log");
  const item = document.createElement("div");
  item.className = "log-item";
  item.textContent = text;
  el.prepend(item);
}

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

function render() {
  document.getElementById("money").textContent = euro(state.money);
  document.getElementById("profit").textContent = euro(state.profit);
  document.getElementById("day").textContent = "Jour " + state.day;

  const market = document.getElementById("market");
  market.innerHTML = "";
  products.forEach(p => {
    if(p.cost > state.money + 300 && p.tier !== "Starter") return;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="emoji">${p.emoji}</div>
      <span class="tier">${p.tier}</span>
      <h3>${p.name}</h3>
      <div class="price-row">
        <span class="buy-price">Achat ${euro(p.cost)}</span>
        <span class="sell-price">Vente ${euro(p.sell)}</span>
      </div>
      <button class="primary" ${state.money < p.cost ? "disabled" : ""}>Commander</button>
    `;
    card.querySelector("button").onclick = () => buy(p);
    market.appendChild(card);
  });

  const shop = document.getElementById("shop");
  shop.innerHTML = "";
  const inventory = products.filter(p => state.stock[p.name] > 0);
  if(inventory.length === 0) {
    shop.innerHTML = `<div class="card"><h3>Votre boutique est vide</h3><p class="stock">Commandez des produits au marché.</p></div>`;
  } else {
    inventory.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="emoji">${p.emoji}</div>
        <span class="tier">${p.tier}</span>
        <h3>${p.name}</h3>
        <p class="stock">Stock : ${state.stock[p.name]}</p>
        <button class="primary">Afficher en boutique</button>
      `;
      card.querySelector("button").onclick = () => sell(p);
      shop.appendChild(card);
    });
  }

  const upgradeGrid = document.getElementById("upgrades");
  upgradeGrid.innerHTML = "";
  upgrades.forEach(u => {
    const level = state.upgrades[u.id];
    const cost = u.base * (level + 1);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="emoji">${u.emoji}</div>
      <span class="tier">Niveau ${level}</span>
      <h3>${u.name}</h3>
      <p class="stock">${u.text}</p>
      <p class="stock">Coût : ${euro(cost)}</p>
      <button class="primary" ${state.money < cost ? "disabled" : ""}>Améliorer</button>
    `;
    card.querySelector("button").onclick = () => purchaseUpgrade(u, cost);
    upgradeGrid.appendChild(card);
  });
  save();
}

function buy(p) {
  if(state.money < p.cost) return;
  state.money -= p.cost;
  state.stock[p.name]++;
  log(`Commande reçue : ${p.name}`);
  toast(`${p.name} ajouté au stock`);
  render();
}

function sell(p) {
  if(state.stock[p.name] <= 0) return;
  const quality = 1 + state.upgrades.qualification * .12;
  const randomDemand = .85 + Math.random() * .3;
  const sale = Math.round(p.sell * randomDemand * quality);
  state.stock[p.name]--;
  state.money += sale;
  state.profit += sale - p.cost;
  log(`${p.name} vendu pour ${euro(sale)}`);
  toast(`Vente réussie : +${euro(sale)}`);
  render();
}

function purchaseUpgrade(u, cost) {
  if(state.money < cost) return;
  state.money -= cost;
  state.upgrades[u.id]++;
  state.reputation++;
  log(`${u.name} amélioré`);
  toast("Amélioration achetée");
  render();
}

document.querySelectorAll("nav button").forEach(button => {
  button.onclick = () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    ["market","shop","upgrades"].forEach(id => document.getElementById(id).classList.add("hidden"));
    const page = button.dataset.page;
    document.getElementById(page).classList.remove("hidden");
    document.getElementById("title").textContent =
      page === "market" ? "Marché fournisseur" :
      page === "shop" ? "Stock de ma boutique" : "Améliorations";
  };
});

setInterval(() => {
  state.day++;
  let sold = 0;

  products.forEach(p => {
    if(state.stock[p.name] > 0) {
      const chance = .08 + state.upgrades.pub * .07;
      if(Math.random() < chance) {
        state.stock[p.name]--;
        const quality = 1 + state.upgrades.qualification * .12;
        const sale = Math.round(p.sell * quality);
        state.money += sale;
        state.profit += sale - p.cost;
        sold++;
        log(`Vente automatique : ${p.name} — ${euro(sale)}`);
      }
    }
  });

  if(sold) toast(`${sold} vente(s) automatique(s)`);
  render();
}, 15000);

load();
render();
log("Bienvenue dans Empire Boutique !");
</script>
</body>
</html>
