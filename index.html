<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PopShop — Ma boutique</title>
<style>
  :root {
    --ink: #26345b;
    --muted: #7180a5;
    --purple: #7657f6;
    --pink: #ff6fae;
    --cyan: #45c9e8;
    --yellow: #ffca55;
    --green: #28be88;
    --red: #ef6680;
    --paper: #fff;
    --bg: #f2f5ff;
    --line: #e7eaff;
    --shadow: 0 12px 35px rgba(58, 76, 142, .10);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 8% 0%, #fff0f8 0, transparent 34%),
      radial-gradient(ellipse at 92% 10%, #e5fbff 0, transparent 32%),
      var(--bg);
  }

  button { font: inherit; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px clamp(16px, 4vw, 55px);
    background: rgba(255,255,255,.86);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
    backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 48px; height: 48px; border-radius: 16px;
    display: grid; place-items: center; color: white; font-size: 25px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow: 0 8px 18px #b69bff80;
  }
  .brand h1 { margin: 0; font-size: 21px; }
  .brand small { color: var(--muted); }
  .top-stats { display: flex; gap: 10px; }
  .top-stat {
    min-width: 130px; padding: 9px 14px; border-radius: 15px;
    background: white; border: 1px solid var(--line); box-shadow: 0 4px 12px #596cb20b;
  }
  .top-stat span { display: block; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .top-stat strong { font-size: 18px; color: var(--green); }
  .top-stat.profit strong { color: var(--purple); }

  .layout {
    max-width: 1450px; margin: auto; padding: 24px;
    display: grid; grid-template-columns: 220px minmax(0,1fr) 285px; gap: 18px;
  }
  .panel, .side-panel {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 22px; box-shadow: var(--shadow);
  }
  .sidebar { padding: 12px; height: fit-content; }
  .nav-button {
    width: 100%; display: flex; align-items: center; gap: 11px;
    padding: 13px 14px; margin: 3px 0; border: 0; border-radius: 13px;
    background: transparent; color: var(--muted); text-align: left;
    font-weight: 750; cursor: pointer; transition: .18s;
  }
  .nav-button:hover { background: #f5f3ff; color: var(--purple); transform: translateX(2px); }
  .nav-button.active { color: white; background: linear-gradient(100deg, var(--purple), #a879ff); box-shadow: 0 7px 17px #9070f44d; }
  .nav-icon { font-size: 19px; }

  .content { min-height: 680px; padding: 23px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .page-head h2 { margin: 0; font-size: 24px; }
  .day-pill { border-radius: 999px; padding: 8px 13px; font-weight: 800; color: #966300; background: #fff5d9; }
  .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 14px; }
  .card {
    overflow: hidden; padding: 15px; border: 1px solid var(--line);
    border-radius: 18px; background: linear-gradient(145deg, #fff, #fbfaff);
    transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  .card:hover { transform: translateY(-3px); border-color: #c9bcff; box-shadow: 0 12px 25px #7881b51c; }
  .item-art {
    height: 95px; display: grid; place-items: center; margin-bottom: 12px;
    border-radius: 14px; font-size: 49px;
    background: linear-gradient(135deg, #fff0f7, #edfaff);
  }
  .tag { display: inline-block; padding: 4px 8px; border-radius: 99px; background: #f0edff; color: var(--purple); font-size: 10px; font-weight: 900; text-transform: uppercase; }
  .card h3 { margin: 8px 0 4px; font-size: 16px; }
  .description { min-height: 18px; color: var(--muted); font-size: 12px; }
  .price-line { display: flex; justify-content: space-between; gap: 8px; margin: 12px 0; font-size: 12px; font-weight: 800; }
  .cost { color: var(--pink); }
  .sell-price { color: var(--green); }
  .stock-info { margin: 10px 0; color: var(--muted); font-size: 13px; }
  .primary, .secondary, .danger {
    min-height: 39px; padding: 9px 13px; border: 0; border-radius: 11px;
    font-weight: 850; cursor: pointer; transition: .15s;
  }
  .primary { width: 100%; color: white; background: linear-gradient(100deg, var(--purple), #a879ff); box-shadow: 0 5px 12px #8866ec38; }
  .primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
  .primary:disabled { opacity: .43; cursor: not-allowed; box-shadow: none; }
  .secondary { color: #206f8e; background: #e6f9ff; }
  .secondary:hover { background: #d3f4ff; }
  .danger { color: #c04661; background: #fff0f2; }
  .empty { grid-column: 1/-1; padding: 36px 20px; text-align: center; color: var(--muted); border: 2px dashed #dfe3f7; border-radius: 17px; }
  .hidden { display: none !important; }

  .side-panel { padding: 17px; height: fit-content; }
  .side-panel h3 { margin: 0 0 13px; font-size: 16px; }
  .quick-card { padding: 13px; border-radius: 15px; background: linear-gradient(135deg, #f1edff, #f5faff); margin-bottom: 15px; }
  .quick-card strong { display: block; margin-bottom: 5px; }
  .quick-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .log { max-height: 275px; overflow-y: auto; }
  .log-entry { margin: 8px 0; padding: 9px 10px; border-radius: 10px; background: #f7f8ff; color: #647294; font-size: 12px; }
  .log-entry.good { border-left: 3px solid var(--green); }
  .log-entry.info { border-left: 3px solid var(--cyan); }
  .small-note { margin-top: 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }

  .quest-card { padding: 18px; border-radius: 18px; background: linear-gradient(135deg, #fff5d9, #fff0f8); border: 1px solid #ffe6b1; }
  .quest-card h3 { margin: 8px 0; }
  .quest-card p { color: var(--muted); }
  .progress { height: 10px; overflow: hidden; border-radius: 20px; background: #e7e9f4; margin: 12px 0; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--pink), var(--purple)); transition: width .25s; }
  .quiz { margin-top: 18px; padding: 18px; border-radius: 18px; background: linear-gradient(135deg, #eafaff, #f3efff); border: 1px solid #dcefff; }
  .quiz h3 { margin: 0 0 8px; }
  .quiz p { color: var(--muted); }
  .answer-list { display: grid; gap: 8px; margin-top: 12px; }
  .answer { padding: 11px 13px; border: 1px solid #dfe3f7; border-radius: 11px; color: var(--ink); background: white; text-align: left; cursor: pointer; }
  .answer:hover:not(:disabled) { border-color: var(--purple); background: #faf8ff; }
  .answer:disabled { cursor: default; opacity: .75; }
  .feedback { min-height: 22px; margin-top: 10px; font-size: 13px; font-weight: 800; }
  .employee-banner { padding: 14px; border-radius: 14px; background: #eafff6; color: #257557; margin-bottom: 15px; }
  .roll-wrap { grid-column: 1/-1; padding: 22px; border-radius: 20px; background: linear-gradient(135deg,#21194e,#5535a5 55%,#8a4fc0); color: white; text-align:center; box-shadow: 0 12px 28px #6440a533; }
  .roll-wrap h3 { margin: 5px 0 8px; font-size: 25px; }
  .roll-display { min-height: 135px; display:grid; place-items:center; margin:18px auto; max-width:360px; border-radius:18px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); font-size:62px; }
  .roll-wrap .primary { max-width:260px; margin:auto; background:linear-gradient(100deg,#ff75b6,#ffd45a); color:#45235e; }
  .rarity-common { border-color:#b9c4d8 !important; } .rarity-uncommon { border-color:#48c98b !important; } .rarity-rare { border-color:#51b9f3 !important; } .rarity-epic { border-color:#b27bff !important; } .rarity-legendary { border-color:#ffb94f !important; } .rarity-mythic { border-color:#ff70b4 !important; } .rarity-secret { border-color:#20202c !important; box-shadow:0 0 16px #1c1c2c30; }
  .rarity-label { font-weight:900; letter-spacing:.5px; }
  .index-summary { grid-column:1/-1; padding:14px; background:#f4f2ff; border-radius:14px; font-weight:800; }
  .employee-card .item-art { height:105px; }
  .toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 10;
    padding: 13px 17px; background: var(--ink); color: white;
    border-radius: 13px; box-shadow: var(--shadow);
    opacity: 0; transform: translateY(15px); transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .footer-actions { display: flex; justify-content: flex-end; margin-top: 22px; }

  @media (max-width: 1050px) {
    .layout { grid-template-columns: 190px minmax(0,1fr); }
    .side-panel { grid-column: 2; }
  }
  @media (max-width: 700px) {
    .topbar { position: static; align-items: flex-start; flex-direction: column; }
    .top-stats { width: 100%; }
    .top-stat { flex: 1; min-width: 0; }
    .layout { display: block; padding: 12px; }
    .sidebar { margin-bottom: 12px; }
    .sidebar nav { display: flex; overflow-x: auto; }
    .nav-button { min-width: max-content; width: auto; }
    .content { min-height: 500px; padding: 16px; margin-bottom: 12px; }
    .side-panel { margin-bottom: 15px; }
    .page-head h2 { font-size: 20px; }
  }
